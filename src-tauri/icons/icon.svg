<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <g transform="translate(512, 512)">
    <!-- Left chat bubble (teal) - slightly behind, rotated -->
    <g transform="translate(-70, -40) rotate(-6)" filter="url(#shadow1)">
      <path d="M -210,-170
               Q -210,-210 -170,-210
               L 170,-210
               Q 210,-210 210,-170
               L 210,100
               Q 210,140 170,140
               L 40,140
               L 0,200
               L -30,140
               L -170,140
               Q -210,140 -210,100 Z"
            fill="url(#grad1)" opacity="0.95"/>
    </g>

    <!-- Right chat bubble (blue) - overlapping, in front -->
    <g transform="translate(70, 40) rotate(6)" filter="url(#shadow2)">
      <path d="M -210,-170
               Q -210,-210 -170,-210
               L 170,-210
               Q 210,-210 210,-170
               L 210,100
               Q 210,140 170,140
               L 50,140
               L 20,200
               L -10,140
               L -170,140
               Q -210,140 -210,100 Z"
            fill="url(#grad2)" opacity="0.92"/>
    </g>
  </g>
</svg>
