name: Build Desktop App

on:
  pull_request:
  push:
    branches:
      - main
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (all/windows/macos)"
        required: false
        default: "all"

jobs:
  # The full JS gate (format/lint/typecheck/unit/e2e/build) runs for every PR
  # and again on every push to main, so a merge-only breakage is caught even
  # though the release builds below stay tag-only.
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Repository quality gates
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm test:e2e && pnpm build

  # ─── Rust (Tauri crate) ─────────────────────────────────
  # The lint job never compiles src-tauri; before this job existed the Rust
  # side was only built by the tag-triggered release jobs below. `cargo test`
  # needs the built server/web bundles (tauri.conf.json resources and
  # frontendDist) plus the gitignored Node sidecar, so prepare them the same
  # way `tauri build` does.
  rust:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system libraries (Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tauri:prepare-sidecar
      - name: Rust tests (Tauri crate)
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ─── Windows ──────────────────────────────────────────────
  build-windows:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app (MSI + NSIS)
        run: pnpm tauri build --bundles msi,nsis
        env:
          RUSTUP_DIST_SERVER: https://rsproxy.cn
          RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Chorus-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS (exe)
        uses: actions/upload-artifact@v4
        with:
          name: Chorus-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ─── macOS ────────────────────────────────────────────────
  build-macos:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app (DMG)
        run: pnpm tauri build --bundles dmg
        env:
          RUSTUP_DIST_SERVER: https://rsproxy.cn
          RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Chorus-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
