name: Release Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and sign DMG
        run: pnpm tauri build --bundles dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and sign MSI and NSIS installers
        run: pnpm tauri build --bundles msi,nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate updater manifest
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const walk = (directory) => fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
            const file = path.join(directory, entry.name);
            return entry.isDirectory() ? walk(file) : [file];
          });
          const files = walk("release-assets");
          const mac = files.find((file) => file.endsWith(".app.tar.gz"));
          const windows = files.find((file) => file.endsWith(".exe"));
          if (!mac || !windows || !fs.existsSync(`${mac}.sig`) || !fs.existsSync(`${windows}.sig`)) {
            throw new Error("Signed updater artifacts were not produced");
          }

          const url = (file) =>
            `https://github.com/${process.env.RELEASE_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${encodeURIComponent(path.basename(file))}`;
          const entry = (file) => ({
            signature: fs.readFileSync(`${file}.sig`, "utf8").trim(),
            url: url(file),
          });
          const macPlatform = /aarch64|arm64/i.test(path.basename(mac))
            ? "darwin-aarch64"
            : "darwin-x86_64";
          const manifest = {
            version: process.env.RELEASE_TAG.replace(/^v/, ""),
            notes: `Chorus ${process.env.RELEASE_TAG}`,
            pub_date: new Date().toISOString(),
            platforms: {
              [macPlatform]: entry(mac),
              "windows-x86_64": entry(windows),
            },
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Upload packages and manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.app.tar.gz
            release-assets/**/*.sig
            release-assets/**/*.msi
            release-assets/**/*.exe
            latest.json
