<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Chorus</title>
    <style>
      /* Pre-bundle boot splash. React replaces this markup on mount; colors mirror styles/themes.css. */
      .chorus-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #111413;
        --boot-accent: #2fa88f;
        --boot-accent-fg: #061b16;
      }
      html[data-theme="light"] .chorus-boot {
        background: #f5f6f3;
        --boot-accent: #137c68;
        --boot-accent-fg: #ffffff;
      }
      .chorus-boot-mark {
        width: 44px;
        height: 44px;
        color: var(--boot-accent);
      }
      .chorus-boot-spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(127, 127, 127, 0.35);
        border-top-color: var(--boot-accent);
        animation: chorus-boot-spin 0.8s linear infinite;
      }
      @keyframes chorus-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .chorus-boot-spinner {
          animation: none;
        }
      }
    </style>
    <script>
      // Apply the persisted theme before first paint; mirrors services/theme.ts.
      try {
        var bootTheme;
        var stored = localStorage.getItem("chorus-theme");
        if (stored === "dark" || stored === "light" || stored === "system") {
          bootTheme =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
        } else {
          bootTheme = window.matchMedia
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : "dark";
        }
        document.documentElement.dataset.theme = bootTheme;
        document.documentElement.classList.toggle("dark", bootTheme === "dark");
      } catch (error) {
        /* keep the dark default */
      }
    </script>
  </head>
  <body class="bg-gray-950 text-gray-100">
    <div id="root">
      <div class="chorus-boot" aria-hidden="true">
        <svg class="chorus-boot-mark" viewBox="0 0 32 32">
          <rect width="32" height="32" rx="8" fill="currentColor" />
          <g fill="none" stroke="var(--boot-accent-fg)" stroke-width="2" stroke-linecap="round">
            <path d="m9.9 9.8 3.2 3.1M24.3 16h-2.5M9.9 22.2l3.2-3.1M19.6 19.6l1.5 1.5" />
            <circle cx="16" cy="16" r="5.2" />
          </g>
          <g fill="var(--boot-accent-fg)" stroke="var(--boot-accent-fg)" stroke-width="0.7">
            <circle cx="8.7" cy="8.6" r="1.45" />
            <circle cx="25.3" cy="16" r="1.45" />
            <circle cx="8.7" cy="23.4" r="1.45" />
          </g>
        </svg>
        <div class="chorus-boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
