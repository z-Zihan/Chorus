services:
  chorus-relay:
    image: chorus/relay:latest
    build:
      context: ../..
      dockerfile: packages/relay/Dockerfile
    ports:
      - "3211:3211"
    volumes:
      - relay-data:/data
    environment:
      RELAY_PORT: "3211"
      RELAY_HOST: "0.0.0.0"
      RELAY_JWT_SECRET: ${RELAY_JWT_SECRET:?Set a strong RELAY_JWT_SECRET of at least 32 characters}
      RELAY_TOKEN_TTL_SECONDS: "86400"
      RELAY_OFFLINE_TTL_DAYS: "7"
      RELAY_MAX_HUBS: "1000"
      RELAY_DB_PATH: /data/relay.db
      RELAY_LOG_LEVEL: info
      RELAY_CORS_ORIGINS: ${RELAY_CORS_ORIGINS:-}
    restart: unless-stopped

volumes:
  relay-data:
